<!doctype html>
<html lang="lt">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#B3263A">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Lenkų k.">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="icon.svg">
<style>:root{color-scheme:light;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}body{margin:0;font:14px system-ui,sans-serif}[hidden]{display:none!important}</style>
<title>Lenkų kalba</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500;12..96,700&family=Atkinson+Hyperlegible:wght@400;700&display=swap">
<style>
/* Vienos kolonos telefono appsas, apačioje 4 skirtukai: Pamokos / Kartoti / Žodynas / Nustatymai */
:root{
  --bg:#F7F2EF; --surface:#FFFFFF; --line:#E3D8D3; --fg:#22181A; --muted:#6E5F62;
  --accent:#B3263A; --accent-ink:#FFFFFF; --soft:#F8E3E5; --ok:#2E7D4F; --okSoft:#DDF0E4; --bad:#B3402A; --badSoft:#F7E0DA;
  --f-display:"Bricolage Grotesque","Segoe UI",system-ui,sans-serif;
  --f-body:"Atkinson Hyperlegible",system-ui,-apple-system,sans-serif;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#151012; --surface:#211A1C; --line:#3A2E31; --fg:#F1E8E9; --muted:#AD9C9F;
  --accent:#F07685; --accent-ink:#1A0E10; --soft:#3A1F24; --ok:#74CF97; --okSoft:#1C3426; --bad:#F29A86; --badSoft:#3D2420; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#151012; --surface:#211A1C; --line:#3A2E31; --fg:#F1E8E9; --muted:#AD9C9F;
  --accent:#F07685; --accent-ink:#1A0E10; --soft:#3A1F24; --ok:#74CF97; --okSoft:#1C3426; --bad:#F29A86; --badSoft:#3D2420; color-scheme:dark}
html,body{min-height:100%}
body{background:var(--bg);color:var(--fg);font-family:var(--f-body);font-size:16px;line-height:1.5;-webkit-tap-highlight-color:transparent}
.wrap{max-width:560px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:16px calc(96px + env(safe-area-inset-bottom,0px))}
h1,h2,h3{font-family:var(--f-display);text-wrap:balance;margin:0;line-height:1.15}
h1{font-size:1.65rem}h2{font-size:1.25rem}h3{font-size:1.02rem}
p{margin:0}
.eyebrow{font-size:.72rem;letter-spacing:.09em;text-transform:uppercase;color:var(--muted);font-weight:700}
.stack{display:flex;flex-direction:column;gap:12px}
.head{display:flex;flex-direction:column;gap:6px;padding-block:4px 10px}
.muted{color:var(--muted)}
button{font:inherit;color:inherit;cursor:pointer}
button:focus-visible,input:focus-visible,textarea:focus-visible,select:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.btn{border:1px solid var(--line);background:var(--surface);border-radius:12px;padding:10px 14px;font-weight:700;min-height:46px}
.btn.primary{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
.btn.small{min-height:36px;padding:6px 12px;font-size:.9rem}
.btn.wide{width:100%}
.btn:disabled{opacity:.45;cursor:not-allowed}
.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.card{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:14px 16px}
.note{background:var(--soft);border-radius:12px;padding:12px 14px;font-size:.95rem}
.note p+p,.card p+p{margin-top:8px}
.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.stat{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:10px}
.stat b{display:block;font-family:var(--f-display);font-size:1.4rem;font-variant-numeric:tabular-nums}
.stat small{color:var(--muted);font-size:.78rem}
/* pamokų sąrašas */
.lesson{display:flex;align-items:center;gap:12px;width:100%;text-align:left;background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:12px 14px}
.lesson .n{flex:0 0 34px;height:34px;border-radius:50%;display:grid;place-items:center;font-weight:700;background:var(--soft);color:var(--accent);font-family:var(--f-display)}
.lesson.done .n{background:var(--ok);color:var(--surface)}
.lesson .t{flex:1;min-width:0}.lesson .t small{display:block;color:var(--muted);font-size:.85rem}
.lesson .sc{font-size:.85rem;font-weight:700;color:var(--ok)}
/* žodžiai ir dialogas */
.words{display:flex;flex-direction:column}
.w{display:flex;align-items:center;gap:10px;padding:8px 0;border-top:1px solid var(--line)}
.w:first-child{border-top:0}
.w .pl{font-weight:700}.w .lt{color:var(--muted);font-size:.92rem}
.w .tx{flex:1;min-width:0}
.say{flex:0 0 auto;width:40px;height:40px;border-radius:50%;border:1px solid var(--line);background:var(--surface);display:inline-grid;place-items:center;padding:0}
.say svg{width:18px;height:18px;fill:var(--accent)}
.say.playing{background:var(--soft)}
.dlg{display:flex;flex-direction:column;gap:8px}
.bub{max-width:86%;padding:8px 12px;border-radius:14px;background:var(--surface);border:1px solid var(--line);align-self:flex-start;text-align:left}
.bub.r{align-self:flex-end;background:var(--soft);border-color:transparent}
.bub .who{font-size:.72rem;font-weight:700;color:var(--muted);text-transform:uppercase;letter-spacing:.06em}
.bub .pl{font-weight:700}
.bub .lt{color:var(--muted);font-size:.9rem}
.bub.now{outline:2px solid var(--accent)}
.hidelt .bub .lt{visibility:hidden}
table.snd{border-collapse:collapse;width:100%;margin:6px 0}
.snd td{padding:6px 6px;border-top:1px solid var(--line)}
.snd td[data-say]{color:var(--accent);font-weight:700;cursor:pointer;text-decoration:underline dotted}
.conj{font-size:.95rem}
/* arabų kursas: arabiškas raštas virš transliteracijos, kita akcento spalva */
.ar{display:block;font-family:"Noto Naskh Arabic","Geeza Pro","Segoe UI","Arial",serif;font-weight:700;font-size:1.3em;line-height:1.7;direction:rtl;unicode-bidi:isolate;text-align:left}
.ar+.tr{display:block}
.q .ar,.flash .ar,.qsub .ar{text-align:center}
.q .ar+.tr,.flash .front .ar+.tr{font-size:.72em}
.ctx .ar{font-size:1.1em}
:root[data-course="ar"]{--accent:#0B6B66;--soft:#DCEFEC}
@media (prefers-color-scheme: dark){:root[data-course="ar"]:not([data-theme="light"]){--accent:#5CC8BE;--accent-ink:#06201E;--soft:#17332F}}
:root[data-course="ar"][data-theme="dark"]{--accent:#5CC8BE;--accent-ink:#06201E;--soft:#17332F}
/* pratybos */
.exbar{display:flex;align-items:center;gap:10px}
.exbar .bar{flex:1;height:8px;background:var(--line);border-radius:4px;overflow:hidden}
.exbar .bar i{display:block;height:100%;background:var(--accent);transition:width .3s}
.x{border:0;background:none;font-size:1.4rem;padding:4px 8px;color:var(--muted)}
.q{font-family:var(--f-display);font-size:1.6rem;font-weight:700;text-align:center;padding:14px 0 6px}
.qsub{text-align:center;color:var(--muted)}
.opts{display:grid;grid-template-columns:1fr;gap:8px}
.opt{border:1px solid var(--line);background:var(--surface);border-radius:12px;padding:12px 14px;min-height:52px;font-weight:700;text-align:left}
.opt.right{border-color:var(--ok);background:var(--okSoft)}
.opt.wrong{border-color:var(--bad);background:var(--badSoft)}
.bigsay{width:84px;height:84px;margin:6px auto;display:grid}
.bigsay svg{width:34px;height:34px}
input.ans,textarea,select{width:100%;box-sizing:border-box;font:inherit;font-size:1.1rem;padding:12px 14px;border:1px solid var(--line);border-radius:12px;background:var(--surface);color:var(--fg)}
textarea{font-size:1rem;min-height:140px}
.pk{display:flex;flex-wrap:wrap;gap:5px;justify-content:center}
.pk button{min-width:34px;min-height:42px;padding:0 4px;border:1px solid var(--line);border-radius:10px;background:var(--surface);font-weight:700}
.tiles{display:flex;flex-wrap:wrap;gap:8px;justify-content:center;min-height:52px}
.tiles.built{border-bottom:2px solid var(--line);padding-bottom:10px;justify-content:flex-start}
.tile{border:1px solid var(--line);background:var(--surface);border-radius:10px;padding:8px 12px;font-weight:700;min-height:42px}
.tile.used{visibility:hidden}
.blank{display:inline-block;min-width:4ch;border-bottom:2px solid var(--accent);color:var(--accent)}
.fb{border-radius:14px;padding:12px 14px;display:flex;flex-direction:column;gap:8px}
.fb.good{background:var(--okSoft)}.fb.bad{background:var(--badSoft)}
.fb b.h{font-family:var(--f-display);font-size:1.1rem}
.fb.good b.h{color:var(--ok)}.fb.bad b.h{color:var(--bad)}
/* kortelės */
.flash{background:var(--surface);border:1px solid var(--line);border-radius:18px;padding:28px 16px;text-align:center;display:flex;flex-direction:column;gap:10px;align-items:center;min-height:180px;justify-content:center}
.flash .front{font-family:var(--f-display);font-size:1.8rem;font-weight:700}
.flash .back{font-size:1.2rem}
.ctx{display:flex;gap:10px;align-items:center;text-align:left;border-top:1px solid var(--line);padding-top:8px}
.ctx b{color:var(--accent)}
.grades{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.grades .btn small{display:block;font-weight:400;font-size:.75rem;color:var(--muted)}
.search{margin-bottom:4px}
details.card summary{cursor:pointer;font-weight:700}
label.lab{font-weight:700;display:block;margin-bottom:4px}
input[type=range]{width:100%;accent-color:var(--accent)}
a{color:var(--accent)}
/* šiandien */
.strip{display:grid;grid-template-columns:repeat(14,1fr);gap:4px}
.strip span{height:14px;border-radius:4px;background:var(--line)}
.strip span.half{background:color-mix(in srgb,var(--accent) 40%,var(--line))}
.strip span.on{background:var(--accent)}
.strip span.today{outline:2px solid var(--fg);outline-offset:1px}
.task{display:flex;gap:12px;align-items:flex-start;background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:12px 14px}
.task .chk{flex:0 0 28px;height:28px;border-radius:50%;border:2px solid var(--line);background:none;padding:0;display:grid;place-items:center;color:var(--surface);margin-top:2px}
.task.done .chk{background:var(--ok);border-color:var(--ok)}
.task.done .chk::after{content:"✓";font-weight:700}
.task.done h3{color:var(--muted)}
.task .t{flex:1;min-width:0}
.task .min{font-size:.85rem;color:var(--muted);white-space:nowrap}
.recs summary{cursor:pointer;list-style:none}.recs summary::-webkit-details-marker{display:none}
.recs ul{list-style:none;margin:8px 0 0;padding:0;display:flex;flex-direction:column;gap:10px}
.recs li{display:flex;flex-direction:column;gap:2px;padding-top:10px;border-top:1px solid var(--line)}
.goal{display:flex;gap:12px;align-items:flex-start;background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:12px 14px}
.goal input{width:22px;height:22px;margin-top:2px;accent-color:var(--accent);flex:0 0 auto}
.goal label{flex:1;min-width:0}
.gchk{flex:0 0 22px;height:22px;border-radius:6px;border:2px solid var(--line);margin-top:2px;display:grid;place-items:center;color:var(--surface);box-sizing:border-box}
.goal.ok .gchk{background:var(--ok);border-color:var(--ok)}.goal.ok .gchk::after{content:"✓";font-weight:700;font-size:.85rem}
.gbar{height:6px;background:var(--line);border-radius:3px;overflow:hidden;margin:6px 0 2px}.gbar i{display:block;height:100%;background:var(--accent)}.goal.ok .gbar i{background:var(--ok)}
.wb{margin-top:6px}.wb summary{cursor:pointer;color:var(--accent);font-size:.9rem;padding:4px 0}
.wbh{font-size:.92rem;margin:10px 0 2px}.wst{font-size:.78rem;color:var(--muted);margin-top:2px}
.wtag{font-size:.75rem;color:var(--muted);white-space:nowrap}.wtag.l2{color:var(--ok);font-weight:600}
.road{border-left:2px solid var(--line);margin:0 0 0 8px;padding:0}
.road li{list-style:none;position:relative;padding:0 0 14px 18px}
.road li::before{content:"";position:absolute;left:-7px;top:5px;width:12px;height:12px;border-radius:50%;background:var(--bg);border:2px solid var(--line)}
.road li.past::before{background:var(--ok);border-color:var(--ok)}
.road li.cur::before{background:var(--accent);border-color:var(--accent)}
.seg{gap:6px}.gram p+p,.gram p+table,.gram table+p{margin-top:8px}.gram table.snd td{font-size:.95rem}
.pill{display:inline-block;font-family:var(--f-body);font-size:.72rem;font-weight:700;padding:2px 8px;border-radius:999px;background:var(--soft);color:var(--accent);vertical-align:middle}
/* skirtukai */
nav.tabs{position:fixed;left:0;right:0;bottom:0;background:var(--surface);border-top:1px solid var(--line);display:grid;grid-template-columns:repeat(6,1fr);padding-left:env(safe-area-inset-left,0px);padding-right:env(safe-area-inset-right,0px);padding-bottom:env(safe-area-inset-bottom,0px);z-index:5}
nav.tabs button{border:0;background:none;padding:10px 1px 12px;font-size:.64rem;font-weight:700;color:var(--muted);display:flex;flex-direction:column;align-items:center;gap:3px;position:relative}
nav.tabs button svg{width:22px;height:22px;stroke:currentColor;fill:none;stroke-width:1.8}
nav.tabs button[aria-selected="true"]{color:var(--accent)}
nav.tabs .badge{position:absolute;top:5px;left:calc(50% + 6px);background:var(--accent);color:var(--accent-ink);border-radius:999px;font-size:.66rem;padding:0 6px;line-height:16px}
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(84px + env(safe-area-inset-bottom,0px));background:var(--fg);color:var(--bg);padding:10px 16px;border-radius:10px;font-weight:700;z-index:9;max-width:90vw}
@media (prefers-reduced-motion: reduce){*{transition:none!important;animation:none!important}}
</style>
</head>
<body>
<div class="wrap"><main id="app" class="stack"></main></div>
<div class="toast" id="toast" hidden></div>
<nav class="tabs" role="tablist" id="tabs">

  <button role="tab" data-v="review" aria-selected="false"><svg viewBox="0 0 24 24"><path d="M4 12a8 8 0 0 1 14-5.3L20 9M20 4v5h-5M20 12a8 8 0 0 1-14 5.3L4 15M4 20v-5h5"/></svg>Kartoti<span class="badge" id="dueBadge" hidden></span></button>

  <button role="tab" data-v="settings" aria-selected="false"><svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="3"/><path d="M12 2v3M12 19v3M4.2 4.2l2.1 2.1M17.7 17.7l2.1 2.1M2 12h3M19 12h3M4.2 19.8l2.1-2.1M17.7 6.3l2.1-2.1"/></svg>Daugiau</button>
</nav>
<script>
/* ===== Egiptiečių arabų kalba kelionėms (kursas „ar“). Tie patys principai kaip lenkų kurse.
   Žodžiai [transliteracija, liet., arabiškai], dialogas [kas, transliteracija, liet., arabiškai],
   gr – [sakinys su ___, atsakymas, užuomina, [klaidingi variantai], tema, visas sakinys arabiškai].
   Transliteracija: aa, ii, uu, ee, oo – ilgi balsiai; kh – ch; gh – gerklinis r; sh – š; ' – ع arba ء/ق ===== */
const AR_COURSE={
lessons:[
{id:"a1",t:"Pasisveikinimai",d:"Labas, labas rytas, kaip sekasi",
 tip:`<p>Egipte kalbama <b>egiptiečių tarme</b>, ne literatūrine arabų kalba (MSA). Ją supranta beveik visas arabų pasaulis, nes iš Egipto ateina daugiausia filmų ir muzikos.</p>
 <p>Žodžius matysi arabiškai ir lotyniškomis raidėmis. Rašyti užtenka lotyniškai:</p>
 <table class="snd">
 <tr><td><b>aa, ii, uu, ee</b></td><td>ilgi balsiai, kaip lietuvių <i>ą, į, ū</i></td><td data-say="سلام">salaam</td></tr>
 <tr><td><b>kh</b></td><td>kaip lietuvių <i>ch</i></td><td data-say="الخير">il-kheer</td></tr>
 <tr><td><b>gh</b></td><td>gerklinis r, kaip prancūzų <i>r</i></td><td data-say="غالي">ghaali</td></tr>
 <tr><td><b>sh</b></td><td>š</td><td data-say="شكراً">shukran</td></tr>
 <tr><td><b>h</b></td><td>visada tariamas, iškvepiant</td><td data-say="الحمد لله">il-hamdu lillaah</td></tr>
 <tr><td><b>'</b></td><td>gerklės „užsikirtimas“ arba gilus gerklinis garsas (ع)</td><td data-say="مع السلامة">ma'a s-salaama</td></tr>
 <tr><td><b>yy, ss…</b></td><td>dviguba raidė tariama ilgiau</td><td data-say="كويس">kwayyis</td></tr>
 </table>
 <p>Į pasisveikinimą atsakoma „veidrodžiu“: <i>sabaah il-kheer</i> (rytas su gerove) → <i>sabaah in-nuur</i> (rytas su šviesa).</p>
 <p>Daug žodžių keičiasi pagal tai, <b>kam</b> sakai: vyrui <i>izzayyak?</i>, moteriai <i>izzayyik?</i>. Ir pagal tai, <b>kas</b> sako: vyras <i>kwayyis</i>, moteris <i>kwayyisa</i>.</p>
 <p><b>Tunise</b> sveikinasi <i>aasslema</i> (labas), <i>labess?</i> (kaip sekasi?) ir dažnai prancūziškai: <i>bonjour, ça va?</i></p>`,
 words:[["ahlan","labas, sveikas","أهلاً"],["ahlan wa sahlan","sveiki atvykę","أهلاً وسهلاً"],["is-salaamu 'aleekum","sveiki (taika jums)","السلام عليكم"],["wa 'aleekum is-salaam","ir jums taika (atsakymas)","وعليكم السلام"],["sabaah il-kheer","labas rytas","صباح الخير"],["sabaah in-nuur","labas rytas (atsakymas)","صباح النور"],["masaa' il-kheer","labas vakaras","مساء الخير"],["masaa' in-nuur","labas vakaras (atsakymas)","مساء النور"],["izzayyak?","kaip sekasi? (vyrui)","إزيك؟"],["izzayyik?","kaip sekasi? (moteriai)","إزيك؟"],["kwayyis","gerai (sako vyras)","كويس"],["kwayyisa","gerai (sako moteris)","كويسة"],["il-hamdu lillaah","ačiū Dievui (viskas gerai)","الحمد لله"],["ma'a s-salaama","viso gero","مع السلامة"],["tisbah 'ala kheer","labos nakties (vyrui)","تصبح على خير"]],
 dialog:[["Ahmedas","sabaah il-kheer!","Labas rytas!","صباح الخير!"],["Mona","sabaah in-nuur! izzayyak?","Labas rytas! Kaip sekasi?","صباح النور! إزيك؟"],["Ahmedas","kwayyis, il-hamdu lillaah. w inti?","Gerai, ačiū Dievui. O tu?","كويس، الحمد لله. وإنتي؟"],["Mona","kwayyisa, il-hamdu lillaah.","Gerai, ačiū Dievui.","كويسة، الحمد لله."],["Ahmedas","yalla, ma'a s-salaama!","Na, viso gero!","يلا، مع السلامة!"],["Mona","ma'a s-salaama, ya Ahmad!","Viso gero, Ahmedai!","مع السلامة يا أحمد!"]],
 gr:[["sabaah il-kheer! – sabaah ___!","in-nuur","Labas rytas! – Labas rytas! (atsakymas)",["il-kheer","is-salaam"],"ats","صباح الخير! – صباح النور!"],

 <p><b>Itfaddal</b> – prašom, kai tau ką nors paduoda ar kviečia užeiti. Jį girdėsi visur.</p>
 <p>Neiginys <b>mish</b> eina prieš žodį: <i>faahim</i> (suprantu) → <i>mish faahim</i> (nesuprantu).</p>
 <p><b>In shaa' allaah</b> (jei Dievas leis) sakoma apie bet kokią ateitį: <i>bukra, in shaa' allaah</i> – rytoj, jei viskas bus gerai. Kartais tai reiškia ir mandagų „gal“.</p>
 <p><b>Tunise:</b> ačiū – <i>yaa'tik saha</i> arba <i>merci</i>, taip – <i>ey</i>, ne – <i>le</i>, gerai – <i>behi</i>.</p>`,

{id:"a3",t:"Prisistatymas",d:"Vardas, iš kur esi, atostogos",

 <p><b>Mano, tavo</b> – galūnė prie žodžio: <i>ism</i> (vardas) → <i>ismi</i> (mano vardas), <i>ismak</i> (tavo, vyrui), <i>ismik</i> (tavo, moteriai).</p>
 <p>Klausimo žodis dažnai eina gale: <i>ismak eeh?</i> = tavo vardas – koks? <i>inta mineen?</i> = tu – iš kur?</p>
 <p>Egiptiečiai labai draugiški ir mėgsta paklausti, iš kur esi. Lietuva – <i>Lituanya</i>, lietuvis – <i>lituaani</i>.</p>`,

{id:"a5",t:"Kainos",d:"Skaičiai iki 1000, kiek kainuoja",
 tip:`<p><b>11–19</b> baigiasi <b>-aashar</b>: hidaashar (11), itnaashar (12), talattaashar (13), arba'taashar (14), khamastaashar (15)…</p>
 <p><b>Dešimtys</b> baigiasi <b>-iin</b>: 'ishriin (20), talatiin (30), arbi'iin (40), khamsiin (50), sittiin (60), sab'iin (70), tamaniin (80), tis'iin (90).</p>
 <p>Sudėtiniai skaičiai sakomi <b>vienetai pirma</b>, kaip vokiškai: <i>khamsa w 'ishriin</i> = penki ir dvidešimt = 25.</p>
 <p><b>Šimtai:</b> miyya (100), miteen (200), talatmiyya (300), rub'umiyya (400), khumsumiyya (500), alf (1000).</p>
 <p>Pinigai – <b>gineeh</b> (Egipto svaras). Po skaičiaus nuo 11 žodis lieka vienaskaitos: <i>khamsiin gineeh</i>. Kainą su skaičiumi sakome su <b>bi-</b>: <i>da b-'ishriin</i> = tai už dvidešimt.</p>
 <p><b>Tunise</b> pinigai – <i>diinaar</i>, o „kiek kainuoja?“ – <i>bqaddesh?</i> (prancūziškai <i>c'est combien ?</i>).</p>`,

{id:"a6",t:"Derybos turguje",d:"Per brangu, paskutinė kaina, tik žiūriu",
 tip:`<p>Turguje (<i>suu'</i>) derėtis įprasta ir net smagu. Pirmoji kaina turistui dažnai būna 2–3 kartus didesnė. Pasiūlyk apie pusę, šypsokis ir neskubėk.</p>
 <p>Jei nenori pirkti, sakyk <i>la' shukran</i> arba <i>ana bass batfarrag</i> (tik žiūriu) ir eik toliau. Dažnai būtent tada kaina nukrenta.</p>
 <p>Pardavėjai kreipiasi <i>ya basha</i> (pone), <i>ya madaam</i> (ponia), <i>ya habiibi</i> (mielasis).</p>
 <p><b>Noriu:</b> vyras sako <i>'aayiz</i>, moteris – <i>'ayza</i>. Daugelis būdvardžių moteriškoje giminėje gauna <b>-a</b>: <i>hilw → hilwa</i> (gražus → graži).</p>
 <p><b>Tunise:</b> <i>ghaali barsha!</i> = labai brangu, <i>barsha</i> = daug, labai.</p>`,

{id:"a7",t:"Kioske",d:"Ar yra? Nėra. Vanduo, ledai, kremas nuo saulės",
 tip:`<p><b>Fiih</b> = yra, ar yra? <b>Mafiish</b> = nėra. Tai vieni naudingiausių žodžių: <i>fiih mayya?</i> – ar yra vandens? <i>mafiish</i> – nėra.</p>
 <p>Pasirinkimas „ar… ar…“ – <b>walla</b>: <i>kibiir walla sughayyar?</i> – didelį ar mažą?</p>
 <p>Vanduo (<i>mayya</i>) – moteriškos giminės, todėl <i>mayya kibiira</i>, <i>mayya sa''a</i> (šaltas vanduo).</p>
 <p>Iš čiaupo Egipte geriau negerti: pirk buteliuose (<i>mayya ma'daniyya</i>).</p>
 <p><b>Tunise:</b> yra – <i>famma</i>, nėra – <i>mafammesh</i>.</p>`,

{id:"a9",t:"Kavinėje",d:"Arbata, kava, cukrus",

{id:"gim",t:"Vyras ar moteris: inta, inti",from:"a1",
 ex:`<p>Arabų kalboje žodis keičiasi pagal tai, <b>su kuo kalbi</b> ir <b>kas kalba</b>. Lietuviui tai pažįstama („esu pavargęs / pavargusi“).</p>
 <table class="snd"><tr><td></td><td>vyrui</td><td>moteriai</td></tr>
 <tr><td>tu</td><td>inta</td><td>inti</td></tr>
 <tr><td>kaip sekasi?</td><td>izzayyak?</td><td>izzayyik?</td></tr>
 <tr><td>prašau</td><td>min fadlak</td><td>min fadlik</td></tr>
 <tr><td>tavo vardas</td><td>ismak</td><td>ismik</td></tr></table>
 <table class="snd"><tr><td></td><td>sako vyras</td><td>sako moteris</td></tr>
 <tr><td>gerai</td><td>kwayyis</td><td>kwayyisa</td></tr>
 <tr><td>noriu</td><td>'aayiz</td><td>'ayza</td></tr>
 <tr><td>nesuprantu</td><td>mish faahim</td><td>mish fahma</td></tr>
 <tr><td>atsiprašau</td><td>aasif</td><td>asfa</td></tr></table>
 <p>Taisyklė paprasta: kreipiantis į moterį dažnai <b>-ak → -ik</b>, o moteris apie save prideda <b>-a</b>.</p>
 <p>Šis, ši: <i>da</i> (vyr. g.), <i>di</i> (mot. g.): <i>da bikaam?</i>, <i>di bikaam?</i></p>`},
{id:"neg",t:"Taip, ne ir neiginys",from:"a2",
 ex:`<p><b>Aywa</b> – taip, <b>la'</b> – ne. Dažnai girdėsi ir <i>la' shukran</i> – ne, ačiū.</p>
 <p><b>Mish</b> eina prieš žodį ir jį paneigia: <i>mish faahim</i> (nesuprantu), <i>mish harr</i> (neaštrus), <i>mish shaghghaal</i> (neveikia), <i>mish 'aayiz</i> (nenoriu).</p>
 <p>Veiksmažodžiai dažnai neigiami <b>ma-…-sh</b>, kaip prancūzų <i>ne… pas</i>: <i>bahibb</i> (mėgstu) → <i>mabahibbish</i> (nemėgstu), <i>'andi</i> (turiu) → <i>ma'andiish</i> (neturiu), <i>fiih</i> (yra) → <i>mafiish</i> (nėra).</p>
 <p>Turistui užtenka <i>mish</i> ir kelių paruoštų žodžių su <i>ma-…-sh</i>.</p>`},
{id:"poss",t:"Mano, tavo ir „turiu“",from:"a3",
 ex:`<p>„Mano, tavo“ – tai galūnė, pridedama prie žodžio:</p>
 <table class="snd"><tr><td><b>-i</b></td><td>mano</td><td>ismi (mano vardas), shantiti (mano krepšys)</td></tr>
 <tr><td><b>-ak</b></td><td>tavo (vyrui)</td><td>ismak</td></tr>
 <tr><td><b>-ik</b></td><td>tavo (moteriai)</td><td>ismik</td></tr>
 <tr><td><b>-u</b></td><td>jo</td><td>ismu</td></tr>
 <tr><td><b>-ha</b></td><td>jos</td><td>ismaha</td></tr></table>
 <p>Žodžiai su <b>-a</b> gale (<i>shanta</i> – krepšys, <i>owda</i> – kambarys) gauna <b>t</b>: <i>shantiti</i>, <i>owditi</i>.</p>
 <p><b>Turiu</b> – <i>'andi</i> (pažodžiui „pas mane“): <i>'andi hagz</i> (turiu rezervaciją), <i>'andi sudaa'</i> (man skauda galvą). <i>'andak?</i> – ar turi? (vyrui).</p>`},
{id:"q",t:"Klausiamieji žodžiai",from:"a3",
 ex:`<p>Egipte klausiamasis žodis dažniausiai eina <b>sakinio gale</b>:</p>
 <table class="snd"><tr><td><b>eeh?</b></td><td>kas? ką?</td><td>ismak eeh? 'aayiz eeh?</td></tr>
 <tr><td><b>feen?</b></td><td>kur?</td><td>il-hammaam feen?</td></tr>
 <tr><td><b>mineen?</b></td><td>iš kur?</td><td>inta mineen?</td></tr>
 <tr><td><b>imta?</b></td><td>kada?</td><td>ir-rihla imta?</td></tr>
 <tr><td><b>kaam?</b></td><td>kiek?</td><td>is-saa'a kaam?</td></tr>
 <tr><td><b>bikaam?</b></td><td>kiek kainuoja?</td><td>da bikaam?</td></tr>
 <tr><td><b>izzaay?</b></td><td>kaip?</td><td>izzayyak? (kaip tu?)</td></tr>
 <tr><td><b>walla</b></td><td>ar (renkantis)</td><td>shaay walla ahwa?</td></tr></table>
 <p>Klausimas „taip / ne“ – tas pats sakinys su klausiama intonacija: <i>fiih mayya?</i> – ar yra vandens?</p>`},
{id:"num",t:"Skaičiai ir arabiški skaitmenys",from:"a4",
 ex:`<table class="snd"><tr><td>٠ sifr</td><td>١ waahid</td><td>٢ itneen</td><td>٣ talaata</td></tr>
 <tr><td>٤ arba'a</td><td>٥ khamsa</td><td>٦ sitta</td><td>٧ sab'a</td></tr>
 <tr><td>٨ tamanya</td><td>٩ tis'a</td><td>١٠ 'ashara</td><td>١٠٠ miyya</td></tr></table>
 <p><b>11–19:</b> -aashar (hidaashar, itnaashar, talattaashar…). <b>Dešimtys:</b> -iin ('ishriin, talatiin, arbi'iin…).</p>
 <p><b>Vienetai pirma:</b> <i>khamsa w talatiin</i> = 35, <i>miyya w 'ishriin</i> = 120.</p>
 <p>Užsakant <b>skaičius eina pirma</b>: <i>waahid shaay</i>, <i>itneen ahwa</i>, <i>talaata koshari</i>.</p>
 <p>Du daiktai – galūnė <b>-een</b>: <i>tazkarteen</i> (du bilietai). Nuo 11 žodis vienaskaitos: <i>khamsiin gineeh</i>.</p>`},
{id:"adj",t:"Būdvardžiai: giminė ir „labai“",from:"a6",
 ex:`<p>Būdvardis eina <b>po</b> daiktavardžio ir derinasi su gimine. Moteriškoji giminė – galūnė <b>-a</b>:</p>
 <table class="snd"><tr><td>kibiir → kibiira</td><td>didelis → didelė</td></tr><tr><td>hilw → hilwa</td><td>gražus → graži</td></tr><tr><td>mashwi → mashwiyya</td><td>keptas ant grotelių</td></tr><tr><td>ga'aan → ga'aana</td><td>alkanas → alkana</td></tr></table>
 <p>Moteriškos giminės žodžiai dažnai baigiasi <b>-a</b>: <i>hadiyya, mayya, shurba, owda</i>. Daiktų daugiskaita (<i>firaakh</i>) irgi derinama kaip moteriškoji.</p>
 <p><b>Labai</b> – <i>awi</i>, eina po būdvardžio: <i>ghaali awi</i> (labai brangu), <i>laziiz awi</i> (labai skanu).</p>
 <p><b>Taani / taanya</b> – kitas, kita: <i>haaga taanya?</i> – dar kas nors?</p>`},
{id:"ayiz",t:"Noriu, galima, mėgstu",from:"a6",
 ex:`<p>Trys žodžiai, su kuriais pasakysi beveik viską:</p>
 <table class="snd"><tr><td><b>'aayiz / 'ayza</b></td><td>noriu (vyras / moteris)</td><td>'aayiz shaay. 'ayza ahwa.</td></tr>
 <tr><td><b>mumkin…?</b></td><td>ar galima…?</td><td>mumkin il-hisaab? mumkin adfa' bil-kart?</td></tr>
 <tr><td><b>bahibb</b></td><td>mėgstu</td><td>ana bahibb il-akl il-masri.</td></tr></table>
 <p><i>Mumkin</i> skamba mandagiau nei <i>'aayiz</i>. Paprasčiausia: <i>mumkin</i> + daiktas: <i>mumkin mayya?</i> – ar galima vandens?</p>
 <p>Neigiamai: <i>mish 'aayiz</i> (nenoriu), <i>mabahibbish</i> (nemėgstu). Paskutinė kaina turguje – <i>aakhir kalaam?</i> (pažodžiui „paskutinis žodis?“).</p>`},
{id:"fiih",t:"Yra ir nėra: fiih, mafiish",from:"a7",
 ex:`<p><b>Fiih</b> – yra. Su klausiama intonacija – ar yra? <b>Mafiish</b> – nėra.</p>
 <table class="snd"><tr><td>fiih mayya?</td><td>ar yra vandens?</td></tr><tr><td>aywa, fiih.</td><td>taip, yra.</td></tr><tr><td>la', mafiish.</td><td>ne, nėra.</td></tr><tr><td>mafiish mushkila</td><td>jokių problemų (nėra problemos)</td></tr></table>
 <p>Nereikia jokių linksnių: <i>fiih</i> + daiktas. Taip paklausi apie viską: <i>fiih wayfay? fiih fuuta? fiih taksi hina?</i></p>`},
{id:"time",t:"Laikas: valandos ir dienos",from:"a8",
 ex:`<p><b>Is-saa'a kaam?</b> – kelinta valanda? <i>Is-saa'a</i> + skaičius: <i>is-saa'a khamsa</i> (penkta).</p>
 <table class="snd"><tr><td>wi rub'</td><td>ir ketvirtis</td><td>is-saa'a talaata wi rub' (3:15)</td></tr><tr><td>wi nuss</td><td>ir pusė</td><td>is-saa'a talaata wi nuss (3:30)</td></tr><tr><td>illa rub'</td><td>be ketvirčio</td><td>is-saa'a arba'a illa rub' (3:45)</td></tr></table>
 <p><i>imbaarih</i> (vakar) – <i>innaharda</i> (šiandien) – <i>bukra</i> (rytoj). <i>Is-subh</i> (ryte), <i>bil-leel</i> (vakare).</p>
 <p>Po, prieš: <i>ba'd il-akl</i> (po valgio), <i>'abl il-akl</i> (prieš valgį). Nuo… iki: <i>min sab'a l-'ashara</i>.</p>`},
{id:"bi",t:"Su ir be: bi-, min gheer",from:"a9",
 ex:`<p><b>Bi-</b> (su) prisijungia prie žodžio: <i>shaay bi-na'naa'</i> (su mėtomis), <i>ahwa bi-laban</i> (su pienu), <i>bil-kart</i> (kortele).</p>
 <p><b>Min gheer</b> – be: <i>min gheer sukkar</i>, <i>min gheer basal</i>, <i>min gheer talg</i> (be ledo).</p>
 <p><b>Li-</b> – kam, iki: <i>tarabeeza li-itneen</i> (staliukas dviem), <i>bikaam lil-mataar?</i> (kiek iki oro uosto?).</p>
 <p>Kaina: <i>bi-</i> + skaičius: <i>da b-'ishriin</i> – tai už dvidešimt.</p>`},
{id:"al",t:"Artikelis il- ir saulės raidės",from:"a10",
 ex:`<p><b>Il-</b> (dar rašoma <i>el-</i>, arabiškai <b>ال</b>) – kaip anglų <i>the</i>: <i>fundu'</i> (viešbutis) → <i>il-fundu'</i> (tas viešbutis).</p>
 <p>Prieš „saulės raides“ <b>l</b> susilieja su kita raide, ir ji tariama dvigubai:</p>
 <table class="snd"><tr><td>sh</td><td>ish-shaay, ish-shams</td></tr><tr><td>s</td><td>is-sukkar, is-saa'a, is-suu'</td></tr><tr><td>t</td><td>it-takyiif</td></tr><tr><td>d</td><td>id-dawa, id-door</td></tr><tr><td>r</td><td>ir-rihla</td></tr><tr><td>n</td><td>in-nuur</td></tr></table>
 <p>Kitos („mėnulio“) raidės nesikeičia: <i>il-bahr, il-menyu, il-mataar, il-hisaab, il-'addaad</i>.</p>
 <p>Rašant arabiškai <b>ال</b> visada vienodas: الشاي (ish-shaay), البحر (il-bahr).</p>`},
{id:"dir",t:"Kur? Kryptys ir vieta",from:"a13",
 ex:`<table class="snd"><tr><td><b>hina / hinaak</b></td><td>čia / ten</td></tr><tr><td><b>'ala tuul</b></td><td>tiesiai</td></tr><tr><td><b>yimiin / shimaal</b></td><td>dešinėn / kairėn</td></tr><tr><td><b>'urayyib / ba'iid</b></td><td>arti / toli</td></tr><tr><td><b>ganb</b></td><td>šalia</td></tr><tr><td><b>'uddaam / wara</b></td><td>priešais / už</td></tr><tr><td><b>ba'd</b></td><td>po, už (ba'd il-kubri – už tilto)</td></tr></table>
 <p>Paliepimai vyrui ir moteriai skiriasi: <i>khud / khudi</i> (imk, suk), <i>imshi / imshi</i> (eik), <i>wa''af / wa''afi</i> (sustok).</p>
 <p>Kelias pėsčiomis – <i>mashi</i>: <i>khamas da'aayi' mashi</i> – penkios minutės pėsčiomis.</p>`}
],

const DAY=864e5;

const PLMAP={'ą':'a','ć':'c','ę':'e','ł':'l','ń':'n','ó':'o','ś':'s','ź':'z','ż':'z'};
const PUNCT=AR?/[.,!?;:…"„”“()\[\]«»—–؟،]/g:/[.,!?;:…"„”“'()\[\]«»—–]/g; // arabų transliteracijoje apostrofas – garsas (ع, ء)
const norm=s=>String(s).toLowerCase().replace(PUNCT,' ').replace(/\s+-\s+|\s-|-\s/g,' ').replace(/\s+/g,' ').trim();
/* Arabų transliteracija atlaidi: be apostrofų ir brūkšnelių, dvigubos raidės = viengubos, š = sh, ch = kh */
const flat=AR?s=>norm(s).replace(/['ʿʾ’`-]/g,'').replace(/š/g,'sh').replace(/ž/g,'zh').replace(/č/g,'ch').replace(/ch/g,'kh').replace(/\s+/g,' ').replace(/([a-z])\1+/g,'$1')
  :s=>norm(s).replace(/[ąćęłńóśźż]/g,c=>PLMAP[c]);
/* Arabiškas raštas pagal transliteraciją: žodžiai [translit., liet., arab.], dialogai [kas, translit., liet., arab.], gramatika x[5] */
let ARM=null;
function arOf(s){if(!AR)return '';if(!ARM){ARM=new Map();const put=(k,v)=>{if(v&&!ARM.has(norm(k)))ARM.set(norm(k),v)};
    for(const l of LESSONS){l.words.forEach(w=>put(w[0],w[2]));l.dialog.forEach(d=>put(d[1],d[3]));(l.gr||[]).forEach(x=>put(x[0].replace('___',x[1]),x[5]))}
    for(const g of GRAMMAR)(g.items||[]).forEach(x=>put(x[0].replace('___',x[1]),x[5]))}
  return ARM.get(norm(s))||''}

/* ===== Pamokos + savi žodžiai ===== */
function customLesson(){if(!S.custom.length)return null;return {id:'custom',t:'Mano žodžiai',d:'Tavo pridėti žodžiai',tip:'',words:S.custom,dialog:[]}}
function allLessons(){const c=customLesson();return c?[...LESSONS,c]:LESSONS}

/* Žodžių ir sakinių rodyklė (perskaičiuojama, kai keičiasi savi žodžiai) */
let IDX=null;
function index(){const key=S.custom.length;if(IDX&&IDX.key===key)return IDX;const words=new Map(),sent=new Map();
  for(const l of allLessons())for(const w of l.words)if(!words.has(w[0]))words.set(w[0],{pl:w[0],lt:w[1],l:l.id});
  for(const l of LESSONS)for(const d of l.dialog){const n=tokens(d[1]).length;if(n>=2&&n<=9&&!sent.has(d[1])&&!words.has(d[1]))sent.set(d[1],{pl:d[1],lt:d[2],l:l.id,s:1,sp:d[0]})}
  return IDX={key,words,sent,wl:[...words.values()]}}
function allWords(){return index().wl}
function lessonSents(l){return l.dialog.map(d=>index().sent.get(d[1])).filter(Boolean)}
/* Kurso tvarka: pamokos numeris ir gramatikos temos */
const ORDER=LESSONS.map(l=>l.id);
function lessonStage(id){return STAGES.findIndex(s=>s.lessons.includes(id))}
function topicById(id){return GRAMMAR.find(g=>g.id===id)}
function topicOpen(g){return lessonStage(g.from)<=S.stage||!!S.done[g.from]}
function lessonOpen(id){return lessonStage(id)<=S.stage||!!S.done[id]}
function topicItems(g){const out=(g.items||[]).map(x=>({x,l:g.from}));for(const l of LESSONS)if(lessonOpen(l.id))for(const x of l.gr)if(x[4]===g.id)out.push({x,l:l.id});return out}
function lessonTopics(l){return [...new Set(l.gr.map(x=>x[4]))].map(topicById).filter(Boolean)}

/* ===== Kartojimas su intervalais (Leitnerio dėžutės) ===== */
const IV=[0,1,2,4,8,16,32,64,120]; // dienomis
const DAY_START=4; // mokymosi diena prasideda 04:00: žodis kartotinas visą termino dieną, nesvarbu, kurią valandą mokeisi
function dayStart(t){const d=new Date(t);d.setHours(DAY_START,0,0,0);if(d.getTime()>t)d.setDate(d.getDate()-1);return d.getTime()}
function dueAfter(days){const d=new Date(dayStart(Date.now()));d.setDate(d.getDate()+days);return d.getTime()}
function card(pl){return S.cards[pl]}
function addCard(pl,lid){if(!S.cards[pl])S.cards[pl]={b:0,due:Date.now(),l:lid,ok:0,bad:0,t:Date.now()}}
/* g: 0 nežinojau, 1 beveik, 2 žinau.
   o.cap – iki kurio lygio žodį gali pakelti užduotis (pasirinkimas tik iki 1, toliau kelia tik įrašytas atsakymas);
   o.drop – kiek lygių numeta klaida: įprastai 2, papildomame kartojime 1, antra klaida toje pačioje sesijoje 0 */
function grade(pl,g,lid,o={}){
  addCard(pl,lid);const c=S.cards[pl];
  if(g===0){c.b=Math.max(0,c.b-(o.drop??2));c.due=Date.now()+5*60e3;c.bad++}
  else if(g===1){c.b=Math.max(1,c.b);const d=dueAfter(Math.max(1,IV[c.b]/2));c.due=c.due>Date.now()+36e5?Math.min(c.due,d):d;c.ok++}
  else{c.ok++;if(c.due>Date.now()+36e5)return; // dar ne laikas kartoti: lygis nekyla, kad žodžio nebūtų galima „išmokti“ per vieną dieną
    if(o.cap!=null&&c.b>=o.cap)return;
    c.b=Math.min(IV.length-1,c.b+1);c.due=dueAfter(IV[c.b])}
}
/* 1.6: terminas – kalendorinė diena. Senus terminus (atsakymo valanda minus 1 val.) perkeliam į tos dienos pradžią */
/* 1.8: nauja kurso seka (6 etapai po 4 pamokas). Etapas – tas, kuriame pirma dar neišmokta pamoka */
function migrate(){const now=Date.now();
  if(!(S.sched>=2)){for(const c of Object.values(S.cards))if(c.due>now+36e5)c.due=dayStart(c.due);S.sched=2}
  if(S.sched<3){S.doneD=S.doneD||{};for(const id of Object.keys(S.done)){const h=(S.hist[id]||[]).find(x=>x.p>=70);S.doneD[id]=S.doneD[id]||(h?h.d:'2000-01-01')}
    const first=ORDER.find(id=>!S.done[id]),ns=first?lessonStage(first):STAGES.length-1;
    if(ns!==S.stage){S.stage=ns;S.stageStart=dkey()}S.sg={};S.test=S.test||{};S.gram=S.gram||{};S.sched=3}
  try{localStorage.setItem(KEY,JSON.stringify(S))}catch(e){}}
function dueCards(){const now=Date.now();return Object.entries(S.cards).filter(([k,c])=>c.due<=now&&wordInfo(k)).sort((a,b)=>a[1].due-b[1].due).map(([k])=>k)}
function wordInfo(pl){const I=index();return I.words.get(pl)||I.sent.get(pl)}
function updBadge(){const n=dueCards().length,b=$('dueBadge');b.hidden=!n;b.textContent=n>99?'99+':n}

/* ===== Balsas (telefono kalbos sintezė) ===== */
let PLV=[];
function loadVoices(){if(!('speechSynthesis' in window))return;PLV=speechSynthesis.getVoices().filter(v=>T.voiceRe.test(v.lang));
  if(AR)PLV.sort((a,b)=>(/EG/i.test(b.lang)-/EG/i.test(a.lang))||(b.localService-a.localService))} // egiptietiški balsai pirmi
if('speechSynthesis' in window){loadVoices();speechSynthesis.onvoiceschanged=()=>{loadVoices();if(VIEW.tab==='settings'&&!EX&&!RV)render()}}
/* Pašnekovų lytis dialoguose: m – vyras, f – moteris */
const PL_SPK={Ania:'f',Ola:'f',Klientka:'f',Pani:'f',B:'f',Tomek:'m',Jonas:'m',Kelner:'m',Klient:'m',Sprzedawca:'m',Turysta:'m',A:'m',Kasjerka:'f',Lekarz:'m',Recepcjonistka:'f',Sprzedawczyni:'f'};
const SPK=AR?AR_COURSE.spk:PL_SPK;
const FEM=/zosia|ewa|paulina|agnieszka|maja|anna|kasia|joanna|marta|ola|salma|zariyah|amany|laila|layla|mariam|hoda|mona|female|kobieta|women|woman/i, MAS=/krzysztof|jacek|adam|marek|jan\b|piotr|shakir|hamed|maged|majed|tarik|naayf|male|mężczyzna|\bman\b/i;
function guessG(v){return FEM.test(v.name)&&!/\bmale/i.test(v.name.replace(/female/i,''))?'f':MAS.test(v.name)?'m':''}
function voiceFor(g){if(!PLV.length)return null;
  const main=PLV.find(v=>v.name===S.voice)||PLV.find(v=>v.localService)||PLV[0];if(!g)return main;
  const pick=g==='f'?S.voiceF:S.voiceM;const chosen=PLV.find(v=>v.name===pick);if(chosen)return chosen;
  return PLV.find(v=>guessG(v)===g)||(g==='f'?main:PLV.find(v=>v!==voiceFor('f'))||main)}
function pitchFor(g){if(!g)return 1;const v=voiceFor(g),o=voiceFor(g==='f'?'m':'f');if(v&&o&&v!==o)return 1;return g==='f'?1.25:.85}
function speak(text,o={}){
  if(!('speechSynthesis' in window)){toast('Šis telefonas nemoka skaityti balsu');return Promise.resolve()}
  if(AR){const a=arOf(text);if(a)text=a;else if(/[a-z]/i.test(text))return Promise.resolve()} // arabų kurse skaitom arabišką raštą
  if(!o.queue)speechSynthesis.cancel();
  return new Promise(res=>{const u=new SpeechSynthesisUtterance(String(text).replace(/\.\.\.|…/g,''));u.lang=T.tts;const v=voiceFor(o.g);if(v)u.voice=v;
    u.rate=o.slow?Math.max(.45,S.rate-.35):S.rate;u.pitch=pitchFor(o.g);u.onend=u.onerror=()=>res();speechSynthesis.speak(u)});
}
document.addEventListener('click',e=>{const b=e.target.closest('[data-say]');if(!b)return;e.preventDefault();
  const slow=b.dataset.slow==='1'||(b.dataset.say===speak.last&&Date.now()-speak.lastT<4000);speak.last=b.dataset.say;speak.lastT=Date.now();
  b.classList.add('playing');speak(b.dataset.say,{slow,g:b.dataset.g}).then(()=>b.classList.remove('playing'))});

{id:"pyt",t:"Klausimai",from:"l11",
 ex:`<p>Klausiamieji žodžiai:</p>

{id:"bier",t:"Galininkas: ką?",from:"l5",

{id:"dop",t:"Kilmininkas: ko?",from:"l5",

{id:"przym",t:"Giminės, būdvardžiai, ten/ta/to",from:"l11",

{id:"miej",t:"Vietininkas: kur?",from:"l9",
 ex:`<p>Vietininkas atsako į klausimą <b>kur?</b> ir eina po <b>w</b> (-e) ir <b>na</b> (ant, -e). Lietuviškai vietininkas yra be prielinksnio (Vilniuje), o lenkiškai su prielinksniu: <i>w Wilnie</i>.</p>

  <h2>Vertina appsas</h2>`;
  G.filter(g=>g.auto).forEach(g=>{h+=`<div class="goal ${g.ok?'ok':''}"><span class="gchk" aria-hidden="true"></span><div style="flex:1;min-width:0"><div>${esc(g.t)}</div><div class="gbar"><i style="width:${Math.min(100,Math.round(g.pct*100))}%"></i></div><small class="muted">${g.ok?'Pasiekta ✓ · ':''}${esc(g.prog)}</small>
    ${g.words?`<details class="wb"><summary>Kuriuos moku, kuriuos dar ne?</summary>${wordsBreakdown(g.words)}</details>`:''}
    ${g.topic?`<div class="row" style="margin-top:6px"><button class="btn small" data-gt="${g.topic}">📘 Atidaryti temą</button></div>`:''}
    ${g.test?`<div class="row" style="margin-top:6px"><button class="btn small ${stageDone()?'primary':''}" id="test">Laikyti testą</button>${stageDone()?'':'<span class="muted" style="font-size:.85rem">Geriausia, kai išmoksi visas etapo pamokas</span>'}</div>`:''}</div></div>`});
  h+=`<h2 style="margin-top:6px">Kalbėjimas garsiai (pažymi pats)</h2>`;
  G.filter(g=>!g.auto).forEach(g=>{h+=`<div class="goal"><input type="checkbox" id="g${g.i}" data-goal="${g.i}" ${g.ok?'checked':''}><label for="g${g.i}">${esc(g.t)}</label></div>`});
  if(!last){
    if(all)h+=`<button class="btn primary" id="next">Pereiti į ${S.stage+2} etapą: ${esc(STAGES[S.stage+1].t)}</button>`;
    else if(day>14)h+=`<div class="note">Praėjo ${day-1} d. Tęsk tas pačias pamokas ir kartojimą, kol pasieksi visus tikslus.</div>`;
    if(!all)h+=confirmNext?`<div class="note row"><span>Ne visi tikslai pasiekti. Pereinant anksčiau spragos vėliau trukdys. Tikrai pereiti?</span><button class="btn small primary" id="nextForce">Taip, pereiti</button><button class="btn small" id="nextCancel">Ne</button></div>`:`<button class="btn small" id="nextAsk" style="align-self:flex-start">Pereiti anksčiau</button>`;
  }else if(all)h+=`<div class="note">${T.finish}</div>`;
  h+=`<h2 style="margin-top:12px">Visas kelias</h2><ul class="road">${STAGES.map((s,i)=>`<li class="${i<S.stage?'past':i===S.stage?'cur':''}"><b>${i+1}. ${esc(s.t)}</b><br><span class="muted" style="font-size:.9rem">${s.lessons.map(id=>esc(lessonById(id).t)).join(' · ')}</span></li>`).join('')}</ul>
  ${S.stage>0?`<button class="btn small" id="prev" style="align-self:flex-start">Grįžti į ankstesnį etapą</button>`:''}`;
  app.innerHTML=h;
  app.querySelectorAll('[data-goal]').forEach(c=>c.onchange=()=>{const a=(S.sg[S.stage]||[]).slice();a[+c.dataset.goal]=c.checked;S.sg[S.stage]=a;save();renderGoals()});
  app.querySelectorAll('[data-gt]').forEach(b=>b.onclick=()=>{VIEW={tab:'lessons',topic:b.dataset.gt,from:'goals'};render();scrollTo(0,0)});
  if($('test'))$('test').onclick=()=>startEx({id:'test',t:`${S.stage+1} etapo testas`,words:[],si:S.stage},buildTest(S.stage));
  const go=n=>{S.stage=n;S.stageStart=dkey();confirmNext=false;save();toast(`${n+1} etapas: ${STAGES[n].t}`);VIEW={tab:'today'};render();scrollTo(0,0)};
  if($('next'))$('next').onclick=()=>go(S.stage+1);
  if($('nextAsk'))$('nextAsk').onclick=()=>{confirmNext=true;renderGoals()};
  if($('nextForce'))$('nextForce').onclick=()=>go(S.stage+1);

/* ===== Balso atpažinimas (kalbėjimo tikrinimas). Chrome Android'e veikia pl-PL ===== */
const SR=window.SpeechRecognition||window.webkitSpeechRecognition;
const micBtn=()=>SR?'<button class="btn small" id="mic" type="button">🎤 Pasakyk</button>':'';
function listenPl(){return new Promise((res,rej)=>{const r=new SR();r.lang=T.tts;r.interimResults=false;r.maxAlternatives=5;let fin=false;
  r.onresult=e=>{fin=true;res([...e.results[0]].map(a=>a.transcript))};r.onerror=e=>{if(!fin){fin=true;rej(e.error)}};r.onend=()=>{if(!fin){fin=true;res([])}};
  if('speechSynthesis' in window)speechSynthesis.cancel();r.start()})}
/* Išgirstą variantą, kuris labiausiai panašus į teisingą, įrašom į laukelį ir tikrinam (spoken=true – atlaidžiau) */
function bindMic(input,target,go){const b=$('mic');if(!b)return;b.onclick=async()=>{b.disabled=true;b.textContent='🎙 Klausausi…';
  try{const alts=await listenPl();if(!alts.length){toast('Nieko neišgirdau. Bandyk dar kartą.');return}
    const best=alts.map(a=>({a,s:AR?checkAr(a,target):checkSent(a,target)})).sort((x,y)=>y.s-x.s)[0];input.value=AR&&best.s?target:best.a;go(true)}
  catch(e){toast(e==='not-allowed'||e==='service-not-allowed'?'Leisk naršyklei naudoti mikrofoną':'Balso atpažinimas nepavyko')}
  finally{if(document.body.contains(b)){b.disabled=false;b.textContent='🎤 Pasakyk'}}}}
/* Sakinio tikrinimas: 2 – tiksliai, 1 – be ženkliukų arba 1–2 raidžių klaida, 0 – neteisingai */
function levFull(a,b){const m=a.length,n=b.length;let p=Array.from({length:n+1},(_,j)=>j);for(let i=1;i<=m;i++){const c=[i];for(let j=1;j<=n;j++)c[j]=Math.min(p[j]+1,c[j-1]+1,p[j-1]+(a[i-1]===b[j-1]?0:1));p=c}return p[n]}
/* Arabų kurse atpažintas tekstas būna arabiškas: lyginam su arabišku raštu, atlaidžiau (tarmė, rašyba) */
function checkAr(heard,t){const b=normAr(arOf(t)),a=normAr(heard);if(!b)return 0;if(a===b)return 2;return levFull(a.replace(/ /g,''),b.replace(/ /g,''))<=Math.max(1,Math.floor(b.length/5))?1:0}
function checkSent(v,t){if(norm(v)===norm(t)||AR&&flat(v)===flat(t))return 2;const a=flat(v),b=flat(t);if(a===b)return 1;return levFull(a,b)<=Math.max(1,Math.floor(b.length/10))?1:0}
const PK=()=>AR?'':`<div class="pk">${'ąćęłńóśźż'.split('').map(c=>`<button data-k="${c}">${c}</button>`).join('')}</div>`;
function bindKeys(a){app.querySelectorAll('[data-k]').forEach(b=>b.onclick=()=>{const s=a.selectionStart??a.value.length,e=a.selectionEnd??s;a.value=a.value.slice(0,s)+b.dataset.k+a.value.slice(e);a.focus();a.setSelectionRange(s+1,s+1)})}

function gGrade(x,ok){const k=gKey(x),e=S.gq[k]||{b:0,due:0};
  if(!ok){e.b=0;e.due=dueAfter(1)}else if(e.due<=Date.now()){e.b=Math.min(IV.length-1,e.b+1);e.due=dueAfter(IV[e.b])}S.gq[k]=e}
const G_DAY=8;
function gramPool(){return LESSONS.filter(l=>S.done[l.id]).flatMap(l=>l.gr)}
function gramDue(){const now=Date.now();return gramPool().filter(x=>{const e=S.gq[gKey(x)];return !e||e.due<=now})}
/* Laiku kartotinos (ir dar nematytos iš išmoktų pamokų), jei jų mažai – papildom silpniausiomis */
function gramDaily(){const due=shuffle(gramDue()).slice(0,G_DAY),rest=gramPool().filter(x=>!due.includes(x)).sort((a,b)=>(S.gq[gKey(a)]||{b:0}).b-(S.gq[gKey(b)]||{b:0}).b);
  const q=due.length>=5?due:[...due,...rest.slice(0,6-due.length)];return shuffle(q).map(gramItem)}

/* ===== Užduočių generavimas =====
   Pratybos remiasi aktyviu prisiminimu: kuo daugiau užduočių, kur atsakymą pateiki pats (rašai, sakai), o ne atpažįsti */
function tokens(s){return norm(s).split(' ').filter(Boolean)}
function distract(right,pool,key,n=3){const r=norm(right[key]),ra=AR&&key==='pl'?arOf(right.pl):'';return shuffle(pool.filter(w=>norm(w[key])!==r&&!(ra&&arOf(w.pl)===ra))).slice(0,n)} // arabų kurse – ne tas pats arabiškas žodis (izzayyak / izzayyik skamba vienodai)
const CAN_HEAR='speechSynthesis' in window;
function lineItems(l){return l.dialog.filter(d=>{const n=tokens(d[1]).length;return n>=2&&n<=9})}
function gramItem(x){return {t:'gram',x,opts:shuffle([x[1],...x[3]]),say:x[0].replace('___',x[1]),lt:x[2],topic:x[4]}}
const optTxt=o=>/[\u0600-\u06FF]/.test(o)?`<span class="ar" lang="ar" style="text-align:left">${esc(o)}</span>`:esc(o);
function lmcItem(d,lines){let pool=lines.filter(x=>x!==d&&x[2]!==d[2]);if(pool.length<3)pool=pool.concat(LESSONS.flatMap(lineItems).filter(x=>x!==d&&!pool.includes(x)));
  return {t:'lmc',line:d,opts:shuffle([d,...shuffle(pool).slice(0,3)]),say:d[1],lt:d[2],g:SPK[d[0]]}}
function dictItem(d){return {t:'dict',line:d,say:d[1],lt:d[2],g:SPK[d[0]]}}
function buildEx(l){
  const W=shuffle(l.words.map(w=>({pl:w[0],lt:w[1]})));
  const pool=l.words.length>=6?l.words.map(w=>({pl:w[0],lt:w[1]})):allWords();
  const easy=[],mid=[],hard=[];
  W.forEach((w,i)=>{
    const k=i%4;
    if(k===0||k===2)easy.push({t:'mc',dir:'pl',w,opts:shuffle([w,...distract(w,pool,'lt')])});
    else if(k===1)easy.push({t:'listen',w,opts:shuffle([w,...distract(w,pool,'pl')])});
    else mid.push({t:'mc',dir:'lt',w,opts:shuffle([w,...distract(w,pool,'pl')])});
  });
  const lines=lineItems(l);
  if(CAN_HEAR)shuffle(lines).slice(0,2).forEach(d=>mid.push(lmcItem(d,lines)));
  const vocab=[...new Set(tokens(l.dialog.map(d=>d[1]).join(' ')+' '+l.words.map(w=>w[0]).join(' ')))].filter(t=>t.length>=3);
  shuffle(l.dialog.filter(d=>tokens(d[1]).some(t=>t.length>=3))).slice(0,1).forEach(d=>{
    const tk=tokens(d[1]).filter(t=>t.length>=3);const gap=pick(tk);
    mid.push({t:'cloze',line:d,gap,opts:shuffle([gap,...shuffle(vocab.filter(v=>v!==gap)).slice(0,3)])})});
  (l.gr||[]).forEach(x=>mid.push(gramItem(x)));
  shuffle(W.filter(w=>w.pl.length<=16)).slice(0,5).forEach(w=>hard.push({t:'type',w}));
  shuffle(lines.filter(d=>tokens(d[1]).length<=7)).slice(0,2).forEach(d=>{
    const tk=tokens(d[1]);const others=tokens(lines.filter(x=>x!==d).map(x=>x[1]).join(' ')).filter(t=>!tk.includes(t));
    hard.push({t:'order',line:d,tiles:shuffle([...tk,...shuffle([...new Set(others)]).slice(0,2)])})});
  if(CAN_HEAR&&lines.length)hard.push(dictItem(pick(lines)));
  return [...easy,...shuffle(mid),...hard];
}
function buildMixed(keys){
  const pool=allWords();const items=[];
  shuffle(keys.filter(k=>index().words.has(k))).slice(0,12).forEach(k=>{const w=pool.find(x=>x.pl===k);if(!w)return;const c=card(k)||{b:0};
    const t=c.b>=3&&w.pl.length<=16?'type':pick(['mc','listen','mcl']);
    if(t==='type')items.push({t:'type',w});

/* Etapo testas: šio etapo žodžiai (pusė rašant), gramatika, klausymas, diktantas ir ~trečdalis ankstesnių etapų žodžių (kaitaliojimas) */
function buildTest(si){const L=STAGES[si].lessons.map(lessonById),pool=allWords(),items=[];
  const cur=shuffle(L.flatMap(l=>l.words.map(w=>({pl:w[0],lt:w[1]})))).slice(0,14);
  const prev=si?shuffle(STAGES.slice(0,si).flatMap(s=>s.lessons).map(lessonById).flatMap(l=>l.words.map(w=>({pl:w[0],lt:w[1]})))).slice(0,7):[];
  [...cur,...prev].forEach((w,i)=>items.push(i%2&&w.pl.length<=16?{t:'type',w}:{t:'mc',dir:'lt',w,opts:shuffle([w,...distract(w,pool,'pl')])}));
  shuffle(L.flatMap(l=>l.gr)).slice(0,6).forEach(x=>items.push(gramItem(x)));
  const lines=L.flatMap(lineItems);
  if(CAN_HEAR){shuffle(lines).slice(0,2).forEach(d=>items.push(lmcItem(d,lines)));shuffle(lines).slice(0,2).forEach(d=>items.push(dictItem(d)))}
  return shuffle(items)}

const RV_MIN=20; // vienoje sesijoje bent tiek žodžių: jei laiku kartotinų mažiau, papildom silpniausiais jau matytais

/* Klaida numeta 2 lygius, papildomame kartojime 1, o antra to paties žodžio klaida sesijoje lygio nebemažina */
function rvFinish(k,g){const drop=RV.lapsed.has(k)?0:RV.extra.has(k)?1:2;if(g===0)RV.lapsed.add(k);
  grade(k,g,undefined,{drop});RV.n++;if(g===2)RV.ok=(RV.ok||0)+1;if(g===0&&!RV.again.has(k)){RV.again.add(k);RV.q.push(k)}save()}
/* Sakinys prie kortelės: dialogo replika su šiuo žodžiu, pirma iš tos pačios pamokos. Jei tikslios formos nėra,
   ieškom linksniuotos tos pačios pamokos replikoje (kawa → kawę, siostra → siostrę, mieszkać → mieszkam) */
const CTX=Object.create(null);
function ctxOf(w){if(w.pl in CTX)return CTX[w.pl];const t=tokens(w.pl),own=[],other=[];let r=null;
  for(const l of LESSONS)for(const d of l.dialog)(l.id===w.l?own:other).push({d,tk:tokens(d[1])});
  const at=x=>{for(let i=0;i+t.length<=x.tk.length;i++)if(t.every((y,j)=>x.tk[i+j]===y))return i;return -1};
  for(const x of [...own,...other]){const i=at(x);if(i>=0){r={d:x.d,i,n:t.length};break}}
  if(!r&&t.length===1&&t[0].length>=4){const s=t[0],long=s.length>=5,st=s.slice(0,long?Math.max(4,s.length-2):3),lo=long?s.length-1:s.length,hi=s.length+(long?3:2);let best=99;
    for(const x of own)x.tk.forEach((y,i)=>{const diff=Math.abs(y.length-s.length);if(y.startsWith(st)&&y.length>=lo&&y.length<=hi&&diff<best){best=diff;r={d:x.d,i,n:1}}})}
  return CTX[w.pl]=r}
function ctxBlock(w){const r=ctxOf(w);if(!r)return '';let t=0;
  const pl=r.d[1].split(' ').map(p=>{const m=tokens(p).length,hit=m&&t<r.i+r.n&&t+m>r.i;t+=m;return hit?`<b>${esc(p)}</b>`:esc(p)}).join(' ');
  const a=arOf(r.d[1]);
  return `<div class="ctx"><button class="say" data-say="${esc(r.d[1])}" data-g="${SPK[r.d[0]]||''}" aria-label="Klausyti sakinio">${SAY_ICON}</button><div>${a?`<span class="ar" lang="ar">${esc(a)}</span>`:''}<div>${pl}</div><div class="muted">${esc(r.d[2])}</div></div></div>`}
/* Po atsakymo: žodis, o po jo – sakinys iš dialogo (jei dar neperėjai prie kito žodžio) */
function rvSpeak(w){if(w.s)return speak(w.pl,{g:SPK[w.sp]});const me=RV,i=RV.i,r=ctxOf(w);speak(w.pl).then(()=>new Promise(res=>setTimeout(res,300))).then(()=>{if(r&&RV===me&&RV.i===i&&RV.res&&'speechSynthesis' in window)speak(r.d[1],{queue:true,g:SPK[r.d[0]]})})}
/* Atsakymo tikrinimas: lenkiškai tiksliai (be ženkliukų – „beveik“), lietuviškai – bet kuris iš variantų */
const LTMAP={'ą':'a','č':'c','ę':'e','ė':'e','į':'i','š':'s','ų':'u','ū':'u','ž':'z'};
const flatLt=s=>norm(s).replace(/[ąčęėįšųūž]/g,c=>LTMAP[c]);
function lev(a,b){const m=a.length,n=b.length;if(Math.abs(m-n)>1)return 2;const d=Array.from({length:m+1},(_,i)=>[i]);for(let j=1;j<=n;j++)d[0][j]=j;
  for(let i=1;i<=m;i++)for(let j=1;j<=n;j++)d[i][j]=Math.min(d[i-1][j]+1,d[i][j-1]+1,d[i-1][j-1]+(a[i-1]===b[j-1]?0:1));return d[m][n]}
function ltAlts(lt){const base=lt.replace(/\([^)]*\)/g,' ');const out=new Set([flatLt(base),flatLt(lt)]);
  base.split(/[,/;]| ar /).forEach(x=>{const f=flatLt(x);if(f)out.add(f)});return [...out].filter(Boolean)}
function checkAns(v,w,dir){ // grąžina 2 teisingai, 1 beveik, 0 neteisingai
  if(dir==='pl'){if(norm(v)===norm(w.pl)||AR&&flat(v)===flat(w.pl))return 2;const a=flat(v),b=flat(w.pl);if(a===b||(b.length>=5&&lev(a,b)<=1))return 1;return 0}
  const a=flatLt(v),alts=ltAlts(w.lt);if(alts.includes(a))return 2;if(alts.some(x=>x.length>=5&&lev(a,x)<=1))return 1;return 0}
function renderRv(){
  if(RV.i>=RV.q.length){if(!RV.marked){RV.marked=1;markDay(RV.n);if(!dueCards().length)markT('rv')}app.innerHTML=`<div class="head" style="text-align:center;padding-top:30px"><h1>${T.rvDone}</h1><p class="muted">Pakartojai ${RV.n} kortel. Teisingai: ${RV.ok||0}.</p></div>
    <button class="btn primary wide" id="out">Baigti</button>${Object.keys(S.cards).length>=5?`<button class="btn wide" id="more">Dar ${dueCards().length?dueCards().length+' laiku kartotinų':Math.min(RV_MIN,Object.keys(S.cards).length)+' žodž.'}</button>`:''}`;
    $('out').onclick=()=>{RV=null;render()};if($('more'))$('more').onclick=startReview;return}
  const k=RV.q[RV.i],w=wordInfo(k);
  const dir=RV.res?RV.res.dir:rvDir(k);
  const p=Math.round(RV.i/RV.q.length*100),R=RV.res;
  app.innerHTML=`<div class="exbar"><button class="x" id="rvX">✕</button><div class="bar"><i style="width:${p}%"></i></div><span class="muted" style="font-size:.85rem">${RV.i}/${RV.q.length}</span></div>
   <div class="flash"><span class="eyebrow">${dir==='pl'?'Parašyk '+T.inLang:dir==='hear'?'Papildomas žodis · įrašyk, ką girdi':dir==='dict'?'Sakinys · diktantas: parašyk, ką girdi':dir==='spl'?'Sakinys · '+(SR?'parašyk arba pasakyk':'parašyk')+' '+T.inLang:'Parašyk, ką reiškia'}</span>
    ${dir==='hear'||dir==='dict'?`<button class="say bigsay" data-say="${esc(w.pl)}" data-g="${w.s?SPK[w.sp]||'':''}" aria-label="Klausyti">${SAY_ICON}</button>`:`<div class="front" ${w.s?'style="font-size:1.35rem"':''}>${dir==='pl'||dir==='spl'?esc(w.lt):tw(w.pl)}</div>${dir==='lt'?sayBtn(w.pl):''}`}</div>
   <input class="ans" id="ans" autocomplete="off" autocapitalize="off" autocorrect="off" spellcheck="false" placeholder="${dir==='lt'?'lietuviškai…':T.inLang+'…'}" ${R?'disabled':''} value="${R?esc(R.v):''}">
   ${dir!=='lt'&&!R?PK():''}
   ${R?`<div class="fb ${R.g===2?'good':'bad'}"><b class="h">${R.g===2?pick(T.praiseRv):R.g===1?'Beveik!':R.skip?'Nieko tokio':'Ne visai'}</b>
      ${R.g===1?`<span>${dir==='lt'?'Nedidelė rašybos klaida.':T.almostRv}</span>`:''}
      <div class="row">${sayBtn(w.pl).replace('class="say ','data-g="'+(w.s?SPK[w.sp]||'':'')+'" class="say ')}<span><b>${tw(w.pl)}</b> · ${esc(w.lt)}</span></div>
      ${w.s?'':ctxBlock(w)}
      ${R.g===0&&!R.skip&&(dir==='lt'||dir==='spl')?`<button class="btn small" id="iwas" style="align-self:flex-start">Mano atsakymas irgi teisingas</button>`:''}
      <button class="btn primary wide" id="next">Toliau</button></div>`
   :`<div class="row"><button class="btn primary" id="chk" style="flex:1">Tikrinti</button>${dir==='spl'||dir==='pl'?micBtn():''}</div><button class="btn small" id="dunno" style="align-self:center">Nežinau</button>`}`;
  $('rvX').onclick=()=>{RV=null;render()};
  if(!R){const a=$('ans');a.focus();if(dir!=='pl'&&dir!=='spl')setTimeout(()=>speak(w.pl,{g:w.s?SPK[w.sp]:undefined}),120);bindKeys(a);
    const go=(skip,spoken)=>{const v=skip?'':a.value;if(!skip&&!v.trim())return;let g=skip?0:w.s?checkSent(v,w.pl):checkAns(v,w,dir==='lt'?'lt':'pl');if(spoken&&g===1)g=2;
      RV.res={v,g,skip,dir,snap:JSON.stringify(S.cards[k]||null)};rvFinish(k,g);render();rvSpeak(w)};
    $('chk').onclick=()=>go(false);a.onkeydown=e=>{if(e.key==='Enter')go(false)};$('dunno').onclick=()=>go(true);bindMic(a,w.pl,sp=>go(false,sp));return}
  const nx=()=>{RV.res=null;RV.i++;if('speechSynthesis' in window)speechSynthesis.cancel();render()};
  $('next').onclick=nx;$('next').focus();
  if($('iwas'))$('iwas').onclick=()=>{ // atšaukiam klaidą: žodis neturi grįžti
    const old=JSON.parse(RV.res.snap);if(old)S.cards[k]=old;else delete S.cards[k];RV.q.splice(RV.q.lastIndexOf(k),1);RV.again.delete(k);RV.lapsed.delete(k);grade(k,2);RV.ok=(RV.ok||0)+1;save();nx()};
}

/* ===== Žodynas + savi žodžiai ===== */
function renderDict(){
  const q=VIEW.q||'';
  const list=allWords().filter(w=>!q||flat(w.pl).includes(flat(q))||norm(w.lt).includes(norm(q))||AR&&normAr(q)&&normAr(arOf(w.pl)).includes(normAr(q)));
  app.innerHTML=`<div class="head"><span class="eyebrow">${allWords().length} žodž.</span><h1>Žodynas</h1></div>
  <input class="ans search" id="q" placeholder="Ieškoti ${T.inLang} ar lietuviškai" value="${esc(q)}" autocapitalize="off">
  <div class="card"><div class="words" id="wl">${list.slice(0,300).map(w=>{const c=card(w.pl);return `<div class="w">${sayBtn(w.pl)}<div class="tx"><div class="pl">${tw(w.pl)}</div><div class="lt">${esc(w.lt)}</div></div>${c?`<span class="wtag l${wLvl(w.pl)}" title="${esc(wHint(w.pl))}">${LVL_NAME[wLvl(w.pl)]}</span>`:''}</div>`}).join('')||'<p class="muted">Nieko nerasta</p>'}</div></div>
  <details class="card" ${S.custom.length?'':'open'}><summary>➕ Pridėti savo žodžių</summary>
   <div class="stack" style="margin-top:10px"><p class="muted" style="font-size:.92rem">Vienas žodis eilutėje: <b>${T.inLang} = lietuviškai</b> (tinka ir „-“ arba tabuliacija).</p>
   <textarea id="cw" placeholder="${T.customEx}"></textarea>
   <button class="btn primary" id="addCw">Pridėti</button>
   ${S.custom.length?`<p class="muted" style="font-size:.9rem">Jau pridėta: ${S.custom.length}. Jie yra pamokoje „Mano žodžiai“.</p><button class="btn small" id="clrCw" style="align-self:flex-start">Ištrinti visus savo žodžius</button>`:''}</div></details>`;
  const qi=$('q');qi.oninput=()=>{VIEW.q=qi.value;const pos=qi.selectionStart;renderDict();const n=$('q');n.focus();n.setSelectionRange(pos,pos)};
  $('addCw').onclick=()=>{const lines=$('cw').value.split('\n');let n=0;
    for(const ln of lines){const m=ln.split(/\s*(?:=|\t|\s[-–—]\s)\s*/);if(m.length<2)continue;const pl=m[0].trim(),lt=m.slice(1).join(' ').trim();if(!pl||!lt)continue;
      if(allWords().some(w=>w.pl===pl))continue;S.custom.push([pl,lt]);addCard(pl,'custom');n++}
    save();toast(n?`Pridėta ${n} žodž.`:'Nieko nepridėta. Naudok formatą: '+T.inLang+' = lietuviškai');renderDict()};
  if($('clrCw'))$('clrCw').onclick=()=>{if(!confirm('Ištrinti visus savo žodžius?'))return;S.custom.forEach(w=>delete S.cards[w[0]]);S.custom=[];save();renderDict()};
}

/* ===== Nustatymai ===== */
function renderSettings(){
  const has='speechSynthesis' in window;
  app.innerHTML=`<div class="head"><h1>Nustatymai</h1></div>
  <div class="card stack"><h2>Kursas</h2><div class="row">${COURSES.map(c=>`<button class="btn small ${c.id===CID?'primary':''}" data-crs="${c.id}">${c.flag} ${esc(c.name)}</button>`).join('')}</div><p class="muted" style="font-size:.92rem">Kiekvieno kurso pažanga saugoma atskirai: perjungus nieko neprarasi.</p></div>
  <div class="card stack"><h2>Balsas</h2>
   ${!has?'<p>Ši naršyklė nemoka skaityti balsu.</p>':PLV.length?`<div><label class="lab" for="vc">Žodžiai ir pratybos</label><select id="vc">${PLV.map(v=>`<option ${v===voiceFor()?'selected':''}>${esc(v.name)}</option>`).join('')}</select></div>
    <div><label class="lab" for="vm">Vyras dialoguose (${T.mNames})</label><div class="row" style="flex-wrap:nowrap"><select id="vm">${PLV.map(v=>`<option ${v===voiceFor('m')?'selected':''}>${esc(v.name)}</option>`).join('')}</select><button class="btn small" data-say="${T.sampleM}" data-g="m">🔊</button></div></div>
    <div><label class="lab" for="vf">Moteris dialoguose (${T.fNames})</label><div class="row" style="flex-wrap:nowrap"><select id="vf">${PLV.map(v=>`<option ${v===voiceFor('f')?'selected':''}>${esc(v.name)}</option>`).join('')}</select><button class="btn small" data-say="${T.sampleF}" data-g="f">🔊</button></div></div>
    ${PLV.length<2?`<p class="muted" style="font-size:.9rem">${T.oneVoice}</p>`:''}
    <details><summary class="muted" style="cursor:pointer">Kaip įdiegti daugiau balsų</summary>${T.voiceHelp}</details>`
   :`<div class="note">${T.noVoiceHelp}</div>`}
   <div><label class="lab" for="rt">Greitis: <span id="rtv">${S.rate.toFixed(2)}</span></label><input type="range" id="rt" min="0.5" max="1.2" step="0.05" value="${S.rate}"></div>
   <button class="btn" data-say="${T.sample}">🔊 Išbandyti</button></div>
  <div class="card stack"><h2>Išvaizda</h2><div class="row">${[['auto','Kaip telefone'],['light','Šviesi'],['dark','Tamsi']].map(([v,n])=>`<button class="btn small ${S.theme===v?'primary':''}" data-th="${v}">${n}</button>`).join('')}</div></div>
  <div class="card stack"><h2>Įdiegti telefone</h2><p><b>Android (Chrome):</b> meniu ⋮ → „Įdiegti programą“ arba „Pridėti prie pradžios ekrano“.</p><p><b>iPhone (Safari):</b> mygtukas „Bendrinti“ → „Į pradžios ekraną“.</p><p class="muted">Įdiegus veikia ir be interneto.</p></div>
  <div class="card stack"><h2>Pažanga</h2><p class="muted" style="font-size:.92rem">Pažanga saugoma tik šiame telefone. Galima nusikopijuoti ir perkelti į kitą įrenginį.</p>
   <div class="row"><button class="btn small" id="exp">Kopijuoti pažangą</button><button class="btn small" id="imp">Įkelti pažangą</button><button class="btn small" id="rst">Pradėti iš naujo</button></div></div>
  <details class="card"><summary>Kaip šis appsas moko (ir kodėl)</summary><div class="stack" style="margin-top:10px;font-size:.95rem">
   <p><b>Aktyvus prisiminimas.</b> Atsakymą pateiki pats: rašai, sakai, sudėlioji. Tai vienas veiksmingiausių mokymosi būdų (Dunlosky ir kt., 2013).</p>
   <p><b>Išdėstytas kartojimas.</b> Kortelės grįžta po 1, 2, 4, 8… dienų, o nauja pamoka ateina kas ~2 dienas. Trumpai, bet kasdien.</p>
   <p><b>Kaitaliojimas.</b> Kartojime ir etapo teste maišomi skirtingų pamokų ir etapų žodžiai, todėl sena medžiaga nepasimiršta.</p>
   <p><b>Keturios kryptys</b> (P. Nation): suprantamas klausymas (dialogai), kalbėjimas (vaidmenys, balsas), kalbos sandara (gramatika, rašyba) ir sklandumas (šešėliavimas, greiti kartojimai).</p>
   <p><b>Frazės, ne tik žodžiai.</b> Dialogų sakiniai kartojami kaip kortelės: gyva kalba sudaryta iš paruoštų frazių.</p>
   <p><b>Aiškūs tikslai.</b> Etapai remiasi Europos kalbų mokėjimo lygių (CEFR) A1 „galiu“ teiginiais: prisistatyti, klausti ir atsakyti apie save, susitarti dėl laiko, apsipirkti.</p>
  </div></details>
  <div class="card stack"><h2>Naudingi šaltiniai</h2>${T.resources}</div>
  <div class="row" style="justify-content:space-between"><span class="muted" style="font-size:.85rem">Versija ${VERSION}</span><button class="btn small" id="upd">Tikrinti atnaujinimus</button></div>`;
  if($('vc'))$('vc').onchange=e=>{S.voice=e.target.value;save()};if($('vm'))$('vm').onchange=e=>{S.voiceM=e.target.value;save()};if($('vf'))$('vf').onchange=e=>{S.voiceF=e.target.value;save()};
  $('rt').oninput=e=>{S.rate=+e.target.value;$('rtv').textContent=S.rate.toFixed(2);save()};
  app.querySelectorAll('[data-th]').forEach(b=>b.onclick=()=>{S.theme=b.dataset.th;save();applyTheme();renderSettings()});
  $('exp').onclick=async()=>{const t=JSON.stringify(S);try{await navigator.clipboard.writeText(t);toast('Nukopijuota. Įklijuok kitame įrenginyje.')}catch(e){prompt('Nukopijuok:',t)}};
  $('imp').onclick=()=>{const t=prompt('Įklijuok nukopijuotą pažangą:');if(!t)return;try{const o=JSON.parse(t);if(!o.cards)throw 0;S=Object.assign(fresh(),o);migrate();save();applyTheme();toast('Pažanga įkelta');render()}catch(e){toast('Netinkamas tekstas')}};
  $('rst').onclick=()=>{if(!confirm('Ištrinti visą pažangą ir savo žodžius?'))return;S=fresh();S.stageStart=dkey();save();applyTheme();render()};
  $('upd').onclick=checkUpdate;
  app.querySelectorAll('[data-crs]').forEach(b=>b.onclick=()=>{if(b.dataset.crs!==CID)switchCourse(b.dataset.crs)});
}
async function checkUpdate(){try{const r=await fetch('version.json?t='+Date.now(),{cache:'no-store'});const j=await r.json();
  if(j.version!==VERSION){toast('Atnaujinama į '+j.version+'…');const reg=navigator.serviceWorker&&await navigator.serviceWorker.getRegistration();if(reg)await reg.update();setTimeout(()=>location.reload(),800)}
  else toast('Turi naujausią versiją')}catch(e){toast('Nepavyko patikrinti (nėra interneto?)')}}

/* ===== Paleidimas ===== */
if(location.protocol.startsWith('http')&&'serviceWorker' in navigator)navigator.serviceWorker.register('sw.js').catch(()=>{});
migrate();updBadge();render();
</script>
